schema_version: 1
id: claude-code
name: Claude Code
profile_version: 1
status: active
scope: public
extends:
  - base
description: >-
  Claude Code 2.1.309 (native install) with the ponytail plugin, its MCP servers
  in ~/.claude.json, and the canonical skill store consumed through per-skill
  symlinks in ~/.claude/skills.
harnesses:
  required:
    - ref: harness-claude-code
      ownership: directly_configured
      version: "2.1.309"
plugins:
  required:
    - ref: plugin-ponytail
      ownership: directly_configured
      version: "5.3.2"
      note: Shared with Codex and OMP at the same version.
mcps:
  required:
    - ref: mcp-pencil
      ownership: directly_configured
      note: Local binary from the pen.dev desktop app.
    - ref: mcp-browseros-neo
      ownership: directly_configured
      note: Local BrowserOS relay on 127.0.0.1:9010.
skills:
  canonical_shared:
    - ref: skill-code-review
      ownership: canonical_shared
      reason: >-
        Claude Code reads ~/.claude/skills; fully identical skills are symlinked to
        the canonical store, divergent variants stay as real directories.
hooks:
  plugin_managed:
    - ref: hook-ponytail-sessionstart-claude-code
      ownership: plugin_managed
      managed_by: plugin-ponytail
    - ref: hook-ponytail-subagentstart-claude-code
      ownership: plugin_managed
      managed_by: plugin-ponytail
    - ref: hook-ponytail-userpromptsubmit-claude-code
      ownership: plugin_managed
      managed_by: plugin-ponytail
environment_variables:
  optional: []
requirements:
  commands:
    - claude
  files:
    - ~/.claude/settings.json
    - ~/.claude.json
  directories:
    - ~/.claude/skills
    - ~/.agents/skills
external_dependencies: []
platforms:
  - linux
notes: >-
  Claude Code only reads ~/.claude/skills, so the canonical store is exposed with
  per-skill symlinks (333 currently). Plugin and bundled skills stay separate, and
  the name "synced" is reserved by Claude Code.
evidence_level: Verified locally
last_verified: "2026-10-25"
